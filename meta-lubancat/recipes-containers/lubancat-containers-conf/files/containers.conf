# poky/meta-virtualization 打包的 podman 不带 containers.conf,回退到的内置默认
# 能力表缺 NET_RAW —— 容器内 ping 一类 raw socket 工具全部 permission denied,
# 而 DNS/HTTP 出网实际正常(2026-09-19 实机验收实测)。这里显式给齐 podman 标准
# 默认能力表,唯一意图是补回 NET_RAW,不额外放宽。
[containers]
default_capabilities = [
  "CHOWN", "DAC_OVERRIDE", "FOWNER", "FSETID", "KILL", "SETGID", "SETUID",
  "SETPCAP", "NET_BIND_SERVICE", "NET_RAW", "SYS_CHROOT", "MKNOD",
  "AUDIT_WRITE", "SETFCAP"
]
