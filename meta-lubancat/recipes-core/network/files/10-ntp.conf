# 板子没有电池 RTC,断电后时钟回到编译时刻。时钟错了 TLS 握手就失败 ——
# 镜像拉不动、外部 API 一个都调不通,而报错长得像证书或网络问题,最容易查错方向。
#
# systemd 内建的 NTP 池(*.pool.ntp.org)在国内基本不通,timesyncd 会一直
# 停在 `System clock synchronized: no`,看起来像它没在跑,其实是在徒劳重试。
# 换成实测可达的阿里云;FallbackNTP 保留内建池,出国或换网时还能兜住。

[Time]
NTP=ntp.aliyun.com ntp1.aliyun.com ntp2.aliyun.com
