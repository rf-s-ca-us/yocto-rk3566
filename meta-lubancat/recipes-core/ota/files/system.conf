# RAUC 系统配置 —— 槽位映射与 wks 分区一一对应(2026-09-26-ota-phase23.md
# 开放项 5 定稿)。无 [keyring] 段 = 拍板 3(暂不验签)的落地:RAUC 对
# system.conf 缺 keyring 的情形直接禁用验证(bundle 完整性仍由 verity 校验)。
#
# wks 分区(实测 5 分区布局,2026-09-12-ota-ab.md:178)→ 槽位映射:
#   p1 uboot            /dev/mmcblk0p1  不进 RAUC(u-boot 升级 = 整盘重烧)
#   p2 boot(共享)      /dev/mmcblk0p2  不进 RAUC(内核/DTB 不随槽切换)
#   p3 rootfs_a         /dev/mmcblk0p3  rootfs.0  bootname=A  PARTUUID 前缀 614e0000-0000
#   p4 rootfs_b         /dev/mmcblk0p4  rootfs.1  bootname=B  PARTUUID 前缀 61500000-0000
#   p5 data(共享)      /dev/mmcblk0p5  不进 RAUC(容器存储与 OTA 日志原地存活)
#
# ⚠ device=/dev/mmcblk0p3|p4 是硬编码,与实板分区号的一致性没有任何构建期
# 机制保证(wic 不回流改 RAUC 配置)。每次重烧/wks 变更后必须跑上板验收
# 手册 §B2 的分区号 ↔ PARTUUID 对账——错号时 bundle 会写进错误分区
# (data 分区首当其冲)。
[update]
compatible=lubancat-rk3566
bootloader=uboot

[slot.rootfs.0]
device=/dev/mmcblk0p3
type=ext4
bootname=A

[slot.rootfs.1]
device=/dev/mmcblk0p4
type=ext4
bootname=B
