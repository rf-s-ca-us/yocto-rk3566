# OTA(A/B 升级)要的内核项 —— RAUC verity bundle 板上安装的前置链路。
#
# 事实链(2026-09-27 查证,全部钉定源码实读):
# - RAUC v1.15.2 的 `rauc install <https URL>` 是流式路径,流式模式明确
#   拒绝 plain bundle("Bundle format 'plain' not supported in streaming
#   mode",src/bundle.c check_bundle)⇒ verity 是唯一可选格式。
# - 读 verity bundle 走 /dev/mapper/control 的 libdevmapper 直调
#   (src/dm.c:144),失败信息原文点名内核项:"check DM_VERITY, DM_CRYPT
#   or CRYPTO_AES kernel options"(src/dm.c:222)。hash 算法默认 sha256,
#   Kconfig 不会随 DM_VERITY 自动选上 digest(drivers/md/Kconfig 的
#   help 原文:"You'll need to activate the digests")。
# - 依赖链 MD ← BLK_DEV_DM ← DM_VERITY 三者均无 default(Kconfig 实读),
#   rockchip_linux_defconfig @ ea9e2a93 一行都没有;alldefconfig 合并带
#   不出来 ⇒ 必须逐级显式给齐,缺一级就被 kconfig 静默丢弃
#   (check-config-misses 教训:丢不报错、编过照跑、上板才炸)。
# - CRYPTO_SHA2_ARM64_CE(defconfig 已有)select 的是 CRYPTO_SHA256_ARM64,
#   不是通用 CRYPTO_SHA256;dm-verity 要用后者,单独补一行。
#
# 验收:build.yml「内核配置自查」已把本文件纳入符号断言(缺项即红);
# §C1(上板验收手册)是最终实机门。
CONFIG_CRYPTO=y
CONFIG_MD=y
CONFIG_BLK_DEV_DM=y
CONFIG_DM_VERITY=y
CONFIG_CRYPTO_SHA256=y

# panic 必须会重启(2026-10-03 评审 F5):两级回退网(bootcount→altbootcmd、
# LEFT 淘汰)只在「跨重启」维度计数,隐含『坏根文件系统表现为 panic 并触发
# 重启』——坏 root 的典型死法正是 panic(VFS 挂不上 root、init 找不到)。
# 而 PANIC_TIMEOUT 的 kconfig 默认 0 = panic 后原地停住,永不重启,回退网
# 整条失效。=10:panic 后 10s 重启,给串口留读 kmsg 的窗口;int 值进不了
# 「内核配置自查」的 =y 断言循环,build.yml 对它单独断值。
# 有意不配 PANIC_ON_OOPS:oops≠panic;mark-good 之后计数全冻结
# (upgrade_available=0 时 bootcount/LEFT 都不数),告警性 oops 若也重启,
# 会变成 ~10s 一轮的无穷重启循环,反而不可救援。
CONFIG_PANIC_TIMEOUT=10
