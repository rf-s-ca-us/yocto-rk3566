# podman 起容器要的内核项。vendor 的 6.1 defconfig 一个都没开 ——
# 装了 podman 却跑不了容器,拉得下镜像,`podman run` 必败。
#
# 清单来自 Moby 的 contrib/check-config.sh 对着板子 /proc/config.gz 跑出来的
# 「Generally Necessary」缺项,不是一个一个试出来的 —— 每试一次是一轮重编
# 加一轮重烧(烧录只能在 Windows 上手点,见 docs/known-issues)。
#
# 下面前四项是「使能项」:check-config.sh 报的缺项里有一大半在当前 .config 里
# 连行都没有(不是 `is not set`,是根本不存在),因为它们的 depends on 不满足。
# 只抄 check-config.sh 的输出而不补这四项,kconfig 会把它们静默丢掉 —— 编得过、
# 烧得进、跑起来还是同样的错。依赖关系是照着 kernel-source 里的 Kconfig 核的。

# 使能项 —— 补它们才轮得到下面那些
CONFIG_NF_CONNTRACK=y		# NF_NAT / IP_NF_NAT / XT_MATCH_CONNTRACK 的前提
CONFIG_BPF_SYSCALL=y		# CGROUP_BPF 的前提
CONFIG_IP6_NF_IPTABLES=y	# 所有 IP6_NF_* 的前提
CONFIG_BRIDGE=y			# BRIDGE_NETFILTER 的前提;也是 cni-podman0 建不起来的直接原因

# 存储驱动。没有它 podman 连 `podman info` 都过不去:
# `kernel does not support overlay fs: 'overlay' is not supported over extfs`
CONFIG_OVERLAY_FS=y

CONFIG_MEMCG=yCONFIG_CGROUP_BPF=y
CONFIG_POSIX_MQUEUE=y
CONFIG_VETH=y
CONFIG_BRIDGE_NETFILTER=y

CONFIG_NF_NAT=y
CONFIG_IP_NF_FILTER=y
CONFIG_IP_NF_NAT=y
CONFIG_IP_NF_RAW=y
CONFIG_IP_NF_TARGET_MASQUERADE=y
CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y
CONFIG_NETFILTER_XT_MATCH_CONNTRACK=y
CONFIG_NETFILTER_XT_MATCH_MARK=y

CONFIG_IP6_NF_FILTER=y
CONFIG_IP6_NF_MANGLE=y
CONFIG_IP6_NF_RAW=y
CONFIG_IP6_NF_NAT=y
CONFIG_IP6_NF_TARGET_MASQUERADE=y

# 故意不开 CONFIG_NETFILTER_XT_MATCH_IPVS:它 depends on IP_VS,要拖进整个
# IPVS 负载均衡子系统,而 xt_ipvs 只有 Docker Swarm 用得上,podman 用不到。

# —— iptables 扩展 ——
#
# check-config.sh 不检查这一族,而 CNI 少一个就整个网络建不起来:
#   iptables: No chain/target/match by that name.
#   Warning: Extension comment revision 0 not supported, missing kernel module?
# 上面这个是实机报错 —— 前面那批全对之后仍然卡在这里,又是一轮重编重烧。
#
# 所以这次不猜:直接 strings 板子上的 CNI 插件和 podman 二进制,看它们到底
# 引用了哪些扩展。板子的 iptables 是 v1.8.10 (legacy) 即 xtables 后端,
# 不是 nft,所以这一族是对的,不需要 NF_TABLES。
#
# 实测引用(bridge / portmap / firewall / podman 四个二进制里都有):
#   --comment      四个都用,每条规则都带
#   multiport      portmap
#   set-xmark      portmap 的 hairpin,对应 TARGET_MARK
#   --dst-type     portmap → ADDRTYPE(上面已开)
#   --ctstate      firewall → CONNTRACK(上面已开)
#   MASQUERADE     portmap → TARGET_MASQUERADE(由 IP_NF_TARGET_MASQUERADE 选上)
CONFIG_NETFILTER_XT_MATCH_COMMENT=y
CONFIG_NETFILTER_XT_MATCH_MULTIPORT=y
CONFIG_NETFILTER_XT_TARGET_MARK=y

# 下面这些没在 strings 里出现,是特意多开的余量。
#
# 理由是两边的代价不对称:多开一个 xt 模块的代价是几 KB 内核体积;少开一个的
# 代价是一整轮重编 + 一次重烧,而烧录只能在 Windows 上手点,必须有人在场。
# 这一族到今天已经让我们多烧了一次,不值得为了几十 KB 再赌第三次。
#
# 挑的是 iptables 常规规则集会碰到的,以及 podman 换到 firewalld / rootless /
# 端口映射等路径时可能走到的;需要拖进新子系统的(IPVS、NF_TABLES、
# CONNLABEL 要的 NF_CONNTRACK_LABELS)一律不开。
CONFIG_NF_CONNTRACK_MARK=y
CONFIG_NETFILTER_XT_MATCH_STATE=y
CONFIG_NETFILTER_XT_MATCH_LIMIT=y
CONFIG_NETFILTER_XT_MATCH_MAC=y
CONFIG_NETFILTER_XT_MATCH_IPRANGE=y
CONFIG_NETFILTER_XT_MATCH_RECENT=y
CONFIG_NETFILTER_XT_MATCH_STATISTIC=y
CONFIG_NETFILTER_XT_MATCH_HELPER=y
CONFIG_NETFILTER_XT_MATCH_OWNER=y
CONFIG_NETFILTER_XT_MATCH_PHYSDEV=y
CONFIG_NETFILTER_XT_MATCH_CONNMARK=y
CONFIG_NETFILTER_XT_MATCH_TCPMSS=y
CONFIG_NETFILTER_XT_TARGET_CONNMARK=y
CONFIG_NETFILTER_XT_TARGET_CHECKSUM=y
CONFIG_NETFILTER_XT_TARGET_REDIRECT=y
CONFIG_NETFILTER_XT_TARGET_NETMAP=y
CONFIG_NETFILTER_XT_TARGET_LOG=y
CONFIG_NETFILTER_XT_TARGET_NFLOG=y
CONFIG_NETFILTER_XT_TARGET_TCPMSS=y
CONFIG_NETFILTER_XT_TARGET_CT=y
