# meta-lubancat —— rk3566-lubancat 板级 layer
# 本仓唯一自写的 layer。第三方 layer 由 setup.sh 拉到 layers/,不在这里。

BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
	    ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "lubancat"
BBFILE_PATTERN_lubancat := "^${LAYERDIR}/"

# 高于 meta-rockchip 的 9,好让本 layer 的 bbappend 压过它
BBFILE_PRIORITY_lubancat = "10"

LAYERDEPENDS_lubancat = "core openembedded-layer rockchip virtualization-layer"
LAYERVERSION_lubancat = "1"
LAYERSERIES_COMPAT_lubancat = "scarthgap"
