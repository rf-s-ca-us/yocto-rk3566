#@TYPE: Distribution
#@NAME: lubancat
#@DESCRIPTION: poky 基础上只加 virtualization —— 板子要跑容器化的 Hermes Agent

require conf/distro/poky.conf

DISTRO = "lubancat"
DISTRO_NAME = "LubanCat (poky 派生)"

# DISTRO_FEATURES 是配置级变量,recipe 里改不动;放机器 conf 里又是撒谎
# (跑不跑容器是发行版的事,不是这块板子的事)。所以单独派生一个 distro,
# 这也是仓能自描述的前提:光看仓就知道镜像里有什么,不用去翻 CI 脚本。
#
# 只加 virtualization。podman 还要的 seccomp / xattr / ipv6 已经在
# poky 的 DISTRO_FEATURES_DEFAULT 里(见 meta/conf/distro/include/
# default-distrovars.inc),aarch64 不在那几条 :remove 的目标里。
DISTRO_FEATURES:append = " virtualization"

# poky 默认 sysvinit(见 poky.conf 的 POKY_INIT_MANAGER),这里覆盖掉。
# 一行换来三件事,每件都是烧录后才发现就得重烧的:
#   1. cgroup 层级自动挂载 —— sysvinit 不挂,而 podman 没有它起不了容器。
#      poky 与 meta-oe 里没有任何东西挂 /sys/fs/cgroup,fstab 也只有
#      proc / devpts / tmpfs(见 base-files/base-files/fstab)。
#   2. systemd-timesyncd 自带 NTP(在 systemd 的默认 PACKAGECONFIG 里)。
#      板子没有电池 RTC,时钟不准 TLS 握手就失败,外部大模型 API 一个都
#      调不通 —— 而报错长得像网络或证书问题,最容易查错方向。
#   3. 容器开机自启有正规做法(podman generate systemd / quadlet),
#      不必手写 initscript。
#
# 赋值来得及:bitbake.conf 第 831 行 include 本文件,第 832 行才 include
# defaultsetup.conf —— 后者才去 require init-manager-${INIT_MANAGER}.inc。
INIT_MANAGER = "systemd"
