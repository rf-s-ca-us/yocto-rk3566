#@TYPE: Distribution
#@NAME: lubancat
#@DESCRIPTION: poky 基础上只加 virtualization —— 板子要跑容器化的 Hermes Agent

require conf/distro/poky.conf

DISTRO = "lubancat"
DISTRO_NAME = "LubanCat (poky 派生)"

# DISTRO_FEATURES 是配置级变量,recipe 里改不动;放机器 conf 里又是撒谎
# (跑不跑容器是发行版的事,不是这块板子的事)。所以单独派生一个 distro,
# 这也是仓能自描述的前提:光看仓就知道镜像里有什么,不用去翻 CI 脚本。
#
# 只加 virtualization。podman 还要的 seccomp / xattr / ipv6 已经在
# poky 的 DISTRO_FEATURES_DEFAULT 里(见 meta/conf/distro/include/
# default-distrovars.inc),aarch64 不在那几条 :remove 的目标里。
DISTRO_FEATURES:append = " virtualization"
