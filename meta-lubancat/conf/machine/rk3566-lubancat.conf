#@TYPE: Machine
#@NAME: LubanCat RK3566
#@DESCRIPTION: 野火 LubanCat1-BTB 核心板 + 野火官方 BTB 底板(公版,非自制)

require conf/machine/include/rk356x.inc

# P2 阶段用 EVB 的 dtb 打通了构建链路,现在换成本板自己的。
# 换的理由不是"更规范",是 EVB2 那块 dtb 让本板联不上网 —— 四项关键值
# 全不同,对照表见 recipes-kernel/linux/files/rk3566-lubancat-1io.dts。
#
# 这个值同时决定内核的 make 目标:linux-rockchip.inc 把它去掉 rockchip/
# 前缀和 .dtb 后缀,拼成 rk3566-lubancat-1io.img 交给 arch/arm64/Makefile
# 的 %.img 规则。所以改这一行等于同时改了 dtb 和 boot.img 的产出。
KERNEL_DEVICETREE = "rockchip/rk3566-lubancat-1io.dtb"

UBOOT_MACHINE = "rk3568_defconfig"
