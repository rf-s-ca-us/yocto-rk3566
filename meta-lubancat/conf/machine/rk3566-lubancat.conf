#@TYPE: Machine
#@NAME: LubanCat RK3566
#@DESCRIPTION: RK3566 自制板,原理图 MAIN_V2

require conf/machine/include/rk356x.inc

# P2 阶段先沿用 EVB 的 dtb 把构建通路打通——先证明工具链、machine conf、
# 镜像通路都对,再在 P4 换成本仓自写的 rockchip/rk3566-lubancat.dtb。
# 故障域隔离:这样"仓建错了"和"引脚填错了"不会混在一起。
KERNEL_DEVICETREE = "rockchip/rk3566-evb2-lp4x-v10-linux.dtb"

UBOOT_MACHINE = "rk3568_defconfig"
