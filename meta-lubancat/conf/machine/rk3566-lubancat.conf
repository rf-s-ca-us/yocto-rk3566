#@TYPE: Machine
#@NAME: LubanCat RK3566
#@DESCRIPTION: 野火 LubanCat1-BTB 核心板 + 野火官方 BTB 底板(公版,非自制)

require conf/machine/include/rk356x.inc

# P2 阶段先沿用 EVB 的 dtb 把构建通路打通——先证明工具链、machine conf、
# 镜像通路都对。故障域隔离:这样"仓建错了"和"引脚填错了"不会混在一起。
#
# 已确认这块 dtb 不足以让本板联网,不用上机验:逐行比对主线
# rk3566-lubancat-1.dts 与 vendor 的 rk3566-evb2-lp4x-v10.dtsi,
# 同样是 gmac1 + rgmii + gmac1m1 引脚组,但三处关键值不同——
#   PHY 复位 GPIO  gpio2 RK_PB0  vs  gpio3 RK_PC2
#   MDIO 地址      rgmii_phy1    vs  rgmii_phy0
#   tx/rx_delay    0x1a/0x0c     vs  0x4f/0x25
# 复位引脚错 PHY 不上电,MDIO 地址错扫不到 PHY。所以 P4 不是"锦上添花",
# 是联网的前置条件。
KERNEL_DEVICETREE = "rockchip/rk3566-evb2-lp4x-v10-linux.dtb"

UBOOT_MACHINE = "rk3568_defconfig"
