name: build

# 分轮种 sstate:第一轮冷编,编到墙钟上限就把 sstate 推 R2;下一轮从 mirror
# 拉回来接着编。几轮之后 sstate 种满,此后每次改动只编增量。
#
# 为什么种在 CI 而不是本机:没有 uninative 时 sstate 绑定构建机的发行版
# (见 poky 的 conf/distro/include/yocto-uninative.inc 注释)。种和用都在
# ubuntu-latest 上,发行版天然一致,命中率才有保障。

on:
  workflow_dispatch:
    inputs:
      target:
        description: bitbake 目标
        default: lubancat-image-minimal
  push:
    branches: [main]
    paths-ignore: ['**.md', 'LICENSE*', 'LICENSES/**']

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    # GitHub 的硬顶是 360 分钟,写更大的值会被静默截断。
    timeout-minutes: 350

    env:
      TARGET: ${{ github.event.inputs.target || 'lubancat-image-minimal' }}
      MACHINE: rk3566-lubancat
      # bitbake 的墙钟上限,必须显著小于 job 的 350 分钟。
      # job 被 GitHub 砍掉时后续 step 根本不会执行(if: always() 也救不回来),
      # 那一轮编的东西就全白费。所以超时必须由 shell 层的 timeout 控制,
      # 留足余量给上传 sstate。
      BITBAKE_TIMEOUT: 260m

    steps:
      - name: 腾磁盘
        run: |
          echo "### 清理前" >> $GITHUB_STEP_SUMMARY
          df -h / | tail -1 >> $GITHUB_STEP_SUMMARY
          # 逐条列出要删什么,不用第三方 action —— 它会拿到本 job 的
          # 全部上下文,而这里只需要几条 rm。
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc /usr/local/.ghcup || true
          sudo rm -rf /usr/local/share/boost || true
          sudo rm -rf /usr/share/swift || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune -af || true
          echo "### 清理后" >> $GITHUB_STEP_SUMMARY
          df -h / | tail -1 >> $GITHUB_STEP_SUMMARY

      - name: 装 Yocto 宿主依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            chrpath cpio diffstat gawk lz4 zstd file device-tree-compiler \
            build-essential texinfo unzip wget git python3 python3-venv

      - name: 放开非特权 user namespace
        # Ubuntu 24.04 默认用 AppArmor 禁掉非特权 user namespace,而 bitbake
        # 需要它(pseudo 靠它伪造文件属主)。不放开会直接:
        #   ERROR: User namespaces are not usable by BitBake, possibly due to AppArmor.
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: 生成 en_US.UTF-8 locale
        # bitbake 强制要求 UTF-8 locale,只有 C.utf8 会启动失败
        run: sudo locale-gen en_US.UTF-8

      - uses: actions/checkout@v4

      - name: 拉第三方 layer
        run: ./setup.sh

      - name: 生成构建配置
        run: |
          ROOT=$PWD
          . layers/poky/oe-init-build-env build >/dev/null
          cat > conf/bblayers.conf <<EOF
          POKY_BBLAYERS_CONF_VERSION = "2"
          BBPATH = "\${TOPDIR}"
          BBFILES ?= ""
          BBLAYERS ?= " \\
            $ROOT/layers/poky/meta \\
            $ROOT/layers/poky/meta-poky \\
            $ROOT/layers/meta-openembedded/meta-oe \\
            $ROOT/layers/meta-openembedded/meta-python \\
            $ROOT/layers/meta-openembedded/meta-networking \\
            $ROOT/layers/meta-openembedded/meta-filesystems \\
            $ROOT/layers/meta-rockchip \\
            $ROOT/layers/meta-virtualization \\
            $ROOT/meta-lubancat \\
          "
          EOF
          {
            echo "MACHINE = \"$MACHINE\""
            # 镜像里有什么由仓决定,不由 CI 决定 —— DISTRO_FEATURES 是配置级
            # 变量,recipe 改不动,所以 meta-lubancat 自带一个 distro。
            echo 'DISTRO = "lubancat"'
            echo 'INHERIT += "rm_work"'
            echo 'BB_NUMBER_THREADS = "4"'
            echo 'PARALLEL_MAKE = "-j 4"'
            # poky 默认 BB_HASHSERVE = "auto",会起一个本地哈希等价服务,
            # 它的库在 build 目录里、每轮 CI 都被丢掉 —— 于是每轮算出的
            # unihash 都不同,从 mirror 拉什么都对不上。bitbake 只发一条
            # WARNING,构建照常绿,但分轮种 sstate 会退化成每轮冷编。
            # 关掉它,用朴素 task hash,mirror 才可能命中。
            echo 'BB_HASHSERVE = ""'
            echo 'BB_SIGNATURE_HANDLER = "OEBasicHash"'
          } >> conf/local.conf
          # Wi-Fi 凭据只从 secret 来,不进仓。默认不设:**这个仓是公开的,
          # 公开仓的 Actions artifact 谁都能下载**,把口令编进镜像等于连同
          # 镜像一起公开发布。真要烧进镜像,先把仓转私有,再配这两个 secret。
          if [ -n "${{ secrets.WIFI_SSID }}" ]; then
            echo 'WIFI_SSID = "${{ secrets.WIFI_SSID }}"' >> conf/local.conf
            echo 'WIFI_PSK = "${{ secrets.WIFI_PSK }}"' >> conf/local.conf
          fi
          if [ -n "${{ vars.SSTATE_BASE_URL }}" ]; then
            echo 'SSTATE_MIRRORS ?= "file://.* ${{ vars.SSTATE_BASE_URL }}/sstate/PATH;downloadfilename=PATH"' >> conf/local.conf
            echo 'SOURCE_MIRROR_URL ?= "${{ vars.SSTATE_BASE_URL }}/downloads/"' >> conf/local.conf
            echo 'INHERIT += "own-mirrors"' >> conf/local.conf
          else
            echo "::warning::未配置 vars.SSTATE_BASE_URL,本轮为纯冷编"
          fi

      - name: 构建
        id: bitbake
        run: |
          export LANG=en_US.UTF-8 LC_ALL=en_US.UTF-8
          . layers/poky/oe-init-build-env build >/dev/null
          set +e
          # 存一份完整输出:sstate 命中率打印在 bitbake 输出的开头,
          # 而 job 日志只能从末尾读,够不着。存下来才能事后捞。
          # 注意此处 cwd 已被 oe-init-build-env 切进 build/,
          # 所以写 bitbake.log 而不是 build/bitbake.log —— 后续步骤
          # 的 cwd 是仓根,它们读的才是 build/bitbake.log。
          timeout "$BITBAKE_TIMEOUT" bitbake "$TARGET" 2>&1 | tee bitbake.log
          code=${PIPESTATUS[0]}
          set -e
          echo "code=$code" >> $GITHUB_OUTPUT
          case $code in
            0)   echo "outcome=完成" >> $GITHUB_OUTPUT ;;
            124) echo "outcome=墙钟到点,本轮未编完(正常,下一轮接着来)" >> $GITHUB_OUTPUT ;;
            *)   echo "outcome=构建失败" >> $GITHUB_OUTPUT ;;
          esac

      - name: sstate 命中率
        if: always()
        run: |
          # 这一行是判断 mirror 到底有没有生效的唯一权威,
          # 靠"这轮比上轮快多少"倒推是猜。
          echo "## sstate 命中率" | tee -a $GITHUB_STEP_SUMMARY
          echo '```' | tee -a $GITHUB_STEP_SUMMARY
          grep -E "Sstate summary|Sstate mirror" build/bitbake.log | tail -5 \
            | tee -a $GITHUB_STEP_SUMMARY || echo "(没找到 Sstate summary 行)"
          echo '```' | tee -a $GITHUB_STEP_SUMMARY

      - name: 镜像内容自查
        if: always()
        run: |
          # "构建通过"不等于"编出来的东西对"。第 7 轮就是全绿但产出是空壳。
          # rootfs.manifest 是 bitbake 自己写的已装包清单,是唯一权威。
          d=build/tmp/deploy/images/$MACHINE
          m=$(ls -1 "$d"/*.rootfs.manifest 2>/dev/null | head -1) || true
          if [ -z "${m:-}" ]; then
            echo "::warning::没有 rootfs.manifest,构建没走到出片"
            exit 0
          fi
          # 前缀匹配,不要求后面紧跟空格:podman 的 RDEPENDS 里 OCI runtime 是
          # 变量 ${VIRTUAL-RUNTIME_container_runtime},实际包名带后缀
          # (runc-opencontainers 之类)。上一轮写成 '^runc ' 就漏掉了,
          # 于是"缺 runtime"是模式的错,不是镜像的错。
          pat='^(podman|conmon|catatonit|crun|runc|netavark|aardvark|slirp4netns|fuse-overlayfs|skopeo|iptables|containers|nsenter|kernel-module-8821cu|wpa-supplicant|lubancat-netcfg|lubancat-wifi|lubancat-ssh-authkeys)'
          {
            echo "## 镜像内容自查"
            echo
            echo "- 已装包总数:$(wc -l < "$m")"
            echo
            echo '```'
            # iptables 会拆出 89 个 iptables-module-* 子包,全打出来会把
            # 真正要看的七八行淹掉。留主包,过滤子包。
            grep -E "$pat" "$m" | grep -Ev '^iptables-module-[a-z0-9]' \
              || echo "(没有任何容器相关包 —— podman 没进镜像)"
            echo '```'
          } | tee -a $GITHUB_STEP_SUMMARY
          # OCI runtime 是硬门槛:没有它 podman 装了也跑不起来,而构建照样绿
          grep -qE '^(crun|runc)' "$m" \
            || echo "::warning::manifest 里没有 crun/runc —— podman 缺 OCI runtime,容器起不来"

          # 包在不在,和"运行时要的那几个文件在不在",是两件事。
          # podman 没有 /etc/containers/policy.json 会在 pull 时直接失败
          # (unable to load signature policy),而这在构建期完全看不出来。
          # rootfs.tar.gz 就在 deploy 里,列出来看是唯一确定的答案。
          t=$(ls -1 "$d"/*.rootfs.tar.gz 2>/dev/null | head -1) || true
          if [ -n "${t:-}" ]; then
            {
              echo
              echo "### 运行时关键文件"
              echo '```'
              # grep 放管道末尾才拿得到它的退出码 —— 后面再接 sort 的话
              # 管道状态就是 sort 的 0,"一个都没有"这条永远不会打印
              tar tzf "$t" | sort \
                | grep -E '(etc/containers/|usr/share/containers/|etc/systemd/system/|lib/systemd/system/podman|bin/(podman|runc|crun|conmon|netavark|aardvark-dns|slirp4netns|catatonit|systemd|systemd-timesyncd)$)' \
                || echo "(一个都没有)"
              echo '```'
            } | tee -a $GITHUB_STEP_SUMMARY
          else
            echo "::warning::没有 rootfs.tar.gz,跳过文件级检查"
          fi

      - name: dtb 自查
        if: always()
        run: |
          # 这一轮改的是 dts,而"能编过"不等于"编出来的内容对" —— 网口那个 bug
          # 恰恰是编得好好的、跑起来才没有接口。所以断言直接问最终产物 dtb,
          # 不问源码:源码写没写对不是这里要回答的问题。
          d=build/tmp/deploy/images/$MACHINE
          b=$(ls -1 "$d"/rk3566-lubancat-1io.dtb 2>/dev/null | head -1) || true
          if [ -z "${b:-}" ]; then
            echo "::warning::没有 rk3566-lubancat-1io.dtb,跳过 dtb 自查"
            exit 0
          fi
          dtc -I dtb -O dts -o /tmp/board.dts "$b" 2>/dev/null

          # dtc 输出里根节点下的节点缩进一个 tab,按此切出单个节点的块
          node() {
            awk -v n="$1" '$0 ~ "^\t"n" \\{" {f=1} f {print} f && /^\t};/ {exit}' /tmp/board.dts
          }

          fail=0
          # GPIO0_A6 在本板是 GMAC1_RSTn。这个稳压器只要还留着 gpio,
          # 它就会把引脚以 gpio + pinmux 两种身份占死,gmac1 拿 -EBUSY,没有网口。
          if node vcc5v0-host-regulator | grep -qE '^\s+(gpio|pinctrl-0) = '; then
            echo "::error::vcc5v0-host-regulator 还占着 gpio/pinctrl —— 网口会重新消失"
            fail=1
          fi
          # 0x1d = 29 = GPIO0_D5,0x1 = GPIO_ACTIVE_LOW。少一样无线就不上电。
          if ! node vcc3v3-wlan-regulator | grep -q '0x1d 0x01'; then
            echo "::error::vcc3v3-wlan-regulator 的 gpio 不是 <gpio0 29 ACTIVE_LOW>"
            fail=1
          fi
          {
            echo "### dtb 自查"
            echo '```'
            node vcc5v0-host-regulator
            node vcc3v3-wlan-regulator
            echo '```'
          } | tee -a $GITHUB_STEP_SUMMARY
          exit $fail

      # 无论编完没编完都要传 —— 半轮的 sstate 也是下一轮的起点,
      # 这正是分轮种 sstate 的全部意义。
      - name: 推 sstate 与 downloads 到 R2
        if: always()
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          # 凭据判断放在 shell 里,不放 if: —— 步骤级 env 在该步骤自己的
          # if 表达式里取不到,那样写这个 step 会被无声跳过。
          if [ -z "${AWS_ACCESS_KEY_ID:-}" ]; then
            echo "::warning::未配置 R2 凭据,跳过上传;本轮 sstate 不会留存"
            exit 0
          fi
          ep="${{ secrets.R2_ENDPOINT }}"
          bucket="${{ vars.R2_BUCKET }}"
          # 构建早期就挂掉时这两个目录可能压根不存在,而 aws s3 sync 对着
          # 不存在的路径会 exit 255 —— 那会把真正的失败原因盖掉。
          if [ -d build/sstate-cache ]; then
            aws s3 sync build/sstate-cache "s3://$bucket/sstate/" \
              --endpoint-url "$ep" --only-show-errors --size-only
          else
            echo "::warning::build/sstate-cache 不存在,构建没走到产出 sstate 就挂了"
          fi
          if [ -d build/downloads ]; then
            aws s3 sync build/downloads "s3://$bucket/downloads/" \
              --endpoint-url "$ep" --only-show-errors --size-only \
              --exclude "*.lock" --exclude "*.tmp" --exclude "git2/*"
          fi

      - name: 上传可烧写镜像
        if: always()
        run: |
          d=build/tmp/deploy/images/$MACHINE
          [ -d "$d" ] || { echo "::warning::没有镜像目录,构建没走到出片"; exit 0; }

          # 先把真实产出列出来 —— 上一轮就是靠猜文件名,一个都没匹配上。
          echo "=== deploy 目录实际内容 ==="
          ls -la "$d"

          mkdir -p out
          # 放宽匹配:不同 IMAGE_FSTYPES 产出的扩展名差别很大。
          # -type f 排掉软链(deploy 目录里大量同名软链指向带时间戳的实体)。
          find "$d" -maxdepth 1 -type f \( \
              -name '*.wic*' -o -name '*.img' -o -name '*.bin' \
              -o -name '*.itb' -o -name '*.dtb' -o -name 'Image*' \
              -o -name '*.parameter' -o -name 'parameter' \
              -o -name 'loader.bin-*' -o -name 'idblock.img-*' \
              -o -name 'trust.img-*' \) \
            -not -name '*.rootfs.ext4' -not -name '*.ufs.wic' \
            -exec cp -L {} out/ \; 2>/dev/null || true
          # 已装包清单一起带上:才能离线核对镜像里到底有什么
          cp -L "$d"/*.rootfs.manifest out/ 2>/dev/null || true

          echo "=== 捞出来的 ==="
          ls -lh out/ || true
          du -sh out/ || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lubancat-image
          path: out/
          if-no-files-found: warn
          retention-days: 14

      - name: 汇总
        if: always()
        run: |
          # 同时写 step summary 和 stdout —— summary 好看但不进日志,
          # 而日志才是能被 API 读到的那份。只写 summary 等于只给人看。
          {
            echo "## 本轮结果"
            echo
            echo "- 目标:\`$TARGET\`  MACHINE:\`$MACHINE\`"
            echo "- 结果:${{ steps.bitbake.outputs.outcome }}(exit ${{ steps.bitbake.outputs.code }})"
            echo
            echo "## 占用"
            echo '```'
            df -h / | tail -1
            du -sh build/sstate-cache build/downloads build/tmp 2>/dev/null || true
            echo '```'
          } | tee -a $GITHUB_STEP_SUMMARY

      # 墙钟到点不算失败:那是分轮种 sstate 的预期状态。
      # 只有真正的构建错误才让这个 job 变红。
      - name: 判定
        if: always()
        run: |
          code="${{ steps.bitbake.outputs.code }}"
          # 步骤在 bitbake 跑起来之前就挂掉时 outputs 为空,当作失败处理
          code="${code:-1}"
          [ "$code" = "0" ] || [ "$code" = "124" ] || exit "$code"
